<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1e1e1e"/>
    </marker>
    <style>
      .node { stroke:#1e1e1e; stroke-width:2; }
      .label { font-family:Arial,sans-serif; font-size:20px; text-anchor:middle; fill:#1e1e1e; }
      .small { font-family:Arial,sans-serif; font-size:16px; text-anchor:middle; fill:#1e1e1e; }
      .title { font-family:Arial,sans-serif; font-size:30px; font-weight:bold; text-anchor:middle; fill:#1e1e1e; }
      .connection { stroke:#1e1e1e; stroke-width:1.5; opacity:0.65; marker-end:url(#arrow); }
      .direct { stroke:#d84315; stroke-width:3; stroke-dasharray:10 7; fill:none; marker-end:url(#arrow); }
      .section { font-family:Arial,sans-serif; font-size:18px; font-weight:bold; text-anchor:middle; fill:#555; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="white"/>
  <text x="800" y="55" class="title">Bengio toy neural language model: network architecture</text>
  <text x="800" y="88" class="small">Example: context “the cat” → target “sat”</text>

  <text x="120" y="145" class="section">Word vectors</text>
  <rect x="35" y="180" width="170" height="120" rx="12" fill="#e8f5e9" class="node"/>
  <text x="120" y="220" class="label"><tspan x="120">C(the)</tspan><tspan x="120" dy="30">3 values</tspan><tspan x="120" dy="28">[.10,.20,.30]</tspan></text>
  <rect x="35" y="360" width="170" height="120" rx="12" fill="#e8f5e9" class="node"/>
  <text x="120" y="400" class="label"><tspan x="120">C(cat)</tspan><tspan x="120" dy="30">3 values</tspan><tspan x="120" dy="28">[.20,.10,.40]</tspan></text>

  <text x="335" y="145" class="section">Concatenated input</text>
  <rect x="250" y="260" width="170" height="220" rx="12" fill="#fff3e0" class="node"/>
  <text x="335" y="310" class="label"><tspan x="335">x</tspan><tspan x="335" dy="32">6 values</tspan><tspan x="335" dy="32">[.10,.20,.30,</tspan><tspan x="335" dy="27">.20,.10,.40]</tspan></text>

  <text x="650" y="145" class="section">Hidden layer: 4 units</text>
  <g fill="#f3e5f5" class="node">
    <circle cx="650" cy="220" r="33"/><circle cx="650" cy="330" r="33"/>
    <circle cx="650" cy="440" r="33"/><circle cx="650" cy="550" r="33"/>
  </g>
  <text x="650" y="227" class="label">h1</text><text x="650" y="337" class="label">h2</text>
  <text x="650" y="447" class="label">h3</text><text x="650" y="557" class="label">h4</text>
  <text x="650" y="625" class="small">h = tanh(d + Hx)</text>

  <text x="1010" y="145" class="section">Output scores: 5 units</text>
  <g fill="#ffebee" class="node">
    <circle cx="1010" cy="190" r="35"/><circle cx="1010" cy="300" r="35"/>
    <circle cx="1010" cy="410" r="35"/><circle cx="1010" cy="520" r="35"/>
    <circle cx="1010" cy="630" r="35"/>
  </g>
  <text x="1010" y="197" class="label">y_the</text><text x="1010" y="307" class="label">y_cat</text>
  <text x="1010" y="417" class="label">y_dog</text><text x="1010" y="527" class="label">y_sat</text>
  <text x="1010" y="637" class="label">y_UNK</text>

  <text x="1330" y="145" class="section">Probability and loss</text>
  <rect x="1200" y="300" width="250" height="110" rx="12" fill="#e0f7fa" class="node"/>
  <text x="1325" y="345" class="label"><tspan x="1325">softmax(y)</tspan><tspan x="1325" dy="32">5 probabilities</tspan></text>
  <rect x="1200" y="520" width="250" height="110" rx="12" fill="#fff8e1" class="node"/>
  <text x="1325" y="565" class="label"><tspan x="1325">target = sat</tspan><tspan x="1325" dy="32">loss = -log P(sat)</tspan></text>

  <line x1="205" y1="240" x2="250" y2="320" class="connection"/>
  <line x1="205" y1="420" x2="250" y2="420" class="connection"/>
  <line x1="420" y1="350" x2="615" y2="220" class="connection"/>
  <line x1="420" y1="370" x2="615" y2="330" class="connection"/>
  <line x1="420" y1="410" x2="615" y2="440" class="connection"/>
  <line x1="420" y1="430" x2="615" y2="550" class="connection"/>
  <line x1="685" y1="220" x2="975" y2="190" class="connection"/>
  <line x1="685" y1="330" x2="975" y2="300" class="connection"/>
  <line x1="685" y1="440" x2="975" y2="410" class="connection"/>
  <line x1="685" y1="550" x2="975" y2="520" class="connection"/>
  <path d="M420,470 C620,780 850,790 975,650" class="direct"/>
  <text x="700" y="820" class="label" fill="#d84315">direct path W x</text>
  <line x1="1045" y1="410" x2="1200" y2="355" class="connection"/>
  <line x1="1325" y1="410" x2="1325" y2="520" class="connection"/>
  <text x="800" y="930" class="small">Output equation: y = b + W x + U h</text>
</svg>
